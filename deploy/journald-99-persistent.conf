# Install to /etc/systemd/journald.conf.d/99-persistent.conf
#
# Raspberry Pi OS ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
# which forces Storage=volatile. Creating /var/log/journal is therefore NOT enough --
# drop-ins are merged in filename order across /etc and /usr/lib, so "99-" is what
# actually overrides "40-".
#
# Installing this file is not sufficient on its own:
#
#   sudo install -D -m 644 journald-99-persistent.conf \
#        /etc/systemd/journald.conf.d/99-persistent.conf
#   sudo systemctl restart systemd-journald
#   sudo journalctl --flush        # <-- required
#
# journald opens /run/log/journal at start and only migrates to /var/log/journal when
# systemd-journal-flush.service tells it to. That service runs once at boot, so a bare
# restart leaves the journal on tmpfs with the new config silently inactive.

[Journal]
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=20M
