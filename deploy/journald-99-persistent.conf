# Install to /etc/systemd/journald.conf.d/99-persistent.conf
#
# Raspberry Pi OS ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
# which forces Storage=volatile. Creating /var/log/journal is therefore NOT enough --
# drop-ins in /etc take precedence over /usr/lib, so this file is what actually switches
# the journal to persistent storage.

[Journal]
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=20M
